version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aceiq_db
    environment:
      POSTGRES_USER: aceiq
      POSTGRES_PASSWORD: aceiq
      POSTGRES_DB: aceiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceiq -d aceiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
